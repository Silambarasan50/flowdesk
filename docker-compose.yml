services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flowdesk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD:-FlowDesk_Dev#2026!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q 'SELECT 1' -C -N -t 5 || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q 'SELECT 1' -t 5 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    container_name: flowdesk-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FlowDeskDb;User Id=sa;Password=${SA_PASSWORD:-FlowDesk_Dev#2026!};TrustServerCertificate=True;MultipleActiveResultSets=true"
      JwtSettings__SecretKey: ${JWT_SECRET:-FlowDeskSuperSecretEnterpriseSigningKey2026!#}
      JwtSettings__Issuer: FlowDeskApi
      JwtSettings__Audience: FlowDeskClient
      JwtSettings__ExpiryMinutes: "1440"
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: flowdesk-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sqlserver-data:
